  ses: "01"
  task: "demo"
  run: "01"
  backend: "headless"
  output_root: "logs"
  seed: 123
  contract_version: "1.1"
  scanner_trigger_mode:
    mode: "none"
    params: {}

display:
  width: 1280
  height: 720
  refresh_hz: 60
  fullscreen: false
